services:
  frontend:
    build: ./apps/frontend
    ports: ["3000:3000"]
    depends_on: [backend]
  backend:
    build: ./apps/backend
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [db, redis, ai-service]
  ai-service:
    build: ./apps/ai-service
    ports: ["8000:8000"]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: weather
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [frontend, backend]
